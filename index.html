<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bo Meter di Awa</title>
  <style>
    :root{
      --bg:#eef1f6;
      --card:#ffffff;
      --text:#0f2748;
      --muted:#66758a;
      --border:#d8dee8;
      --primary:#3167e3;
      --primary-dark:#244fb8;
      --soft:#eef3ff;
      --green:#18a957;
      --orange:#e28a1a;
      --red:#d63b3b;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      background:var(--bg);
      font-family:Arial, sans-serif;
      color:var(--text);
      padding:16px;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
    }

    .card{
      background:var(--card);
      border-radius:28px;
      padding:28px;
      margin-bottom:20px;
      box-shadow:0 0 0 1px rgba(0,0,0,.03);
    }

    h1,h2,h3{
      margin:0 0 14px 0;
      text-align:center;
      color:var(--text);
    }

    h1{
      font-size:42px;
      font-weight:700;
    }

    h2{
      font-size:32px;
      font-weight:700;
    }

    .sub{
      text-align:center;
      color:var(--muted);
      font-size:16px;
      margin-bottom:20px;
    }

    .pill{
      margin:0 auto;
      display:inline-block;
      padding:14px 18px;
      border-radius:999px;
      background:var(--soft);
      border:1px solid #bfd0ff;
      font-weight:700;
      color:var(--text);
    }

    .center{
      text-align:center;
    }

    .grid-3{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:16px;
    }

    .label{
      display:block;
      margin-bottom:8px;
      color:var(--muted);
      font-size:14px;
    }

    input, select{
      width:100%;
      height:56px;
      border-radius:16px;
      border:1px solid #cfd7e5;
      padding:0 16px;
      font-size:16px;
      background:#fff;
    }

    .meter-card{
      border:1px solid var(--border);
      border-radius:20px;
      padding:18px;
      margin-top:16px;
      background:#fbfcff;
    }

    .meter-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:12px;
      font-weight:700;
      font-size:20px;
    }

    .grid-4{
      display:grid;
      grid-template-columns:1.2fr 1fr 1fr 1fr;
      gap:14px;
    }

    .usage-box{
      height:56px;
      border-radius:16px;
      border:1px solid #cfd7e5;
      background:#f4f7fb;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 16px;
      font-size:16px;
      font-weight:700;
    }

    .status{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      color:var(--muted);
      margin-top:12px;
    }

    .dot{
      width:12px;
      height:12px;
      border-radius:50%;
      display:inline-block;
    }

    .green{ background:var(--green); }
    .orange{ background:var(--orange); }
    .red{ background:var(--red); }

    .actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:18px;
    }

    button{
      height:60px;
      border:none;
      border-radius:18px;
      font-size:18px;
      cursor:pointer;
    }

    .btn-light{
      background:#eef2ff;
      color:var(--text);
      border:1px solid #bfd0ff;
    }

    .btn-primary{
      background:var(--primary);
      color:#fff;
    }

    .btn-primary:hover{
      background:var(--primary-dark);
    }

    .summary{
      margin-top:18px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:14px;
    }

    .summary-card{
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px;
      background:#fbfcff;
      text-align:center;
    }

    .summary-card .big{
      font-size:28px;
      font-weight:700;
      margin-top:6px;
    }

    .upgrade-note{
      margin-top:14px;
      text-align:center;
      color:var(--muted);
      font-size:14px;
    }

    .warn{
      color:var(--red);
      font-weight:700;
    }

    @media (max-width: 900px){
      .grid-3, .grid-4, .summary, .actions{
        grid-template-columns:1fr;
      }

      h1{font-size:34px}
      h2{font-size:28px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Bo Meter di Awa</h1>
      <div class="sub">Basic version supports up to 3 meters per address.</div>
      <div class="center">
        <div class="pill">Closed Group • Max 500 users per country</div>
      </div>
    </div>

    <div class="card">
      <h2>Property Info</h2>
      <div class="grid-3">
        <div>
          <label class="label">Country</label>
          <select id="country">
            <option>Curaçao</option>
            <option>Aruba</option>
            <option>Bonaire</option>
          </select>
        </div>
        <div>
          <label class="label">Address</label>
          <input id="address" type="text" value="z choloma 41" />
        </div>
        <div>
          <label class="label">Owner / Property Name</label>
          <input id="owner" type="text" value="Purcy" />
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Meters</h2>
      <div class="sub">Add 1 to 3 meters in basic. More than 3 = upgrade.</div>

      <div id="metersContainer"></div>

      <div class="actions">
        <button class="btn-light" onclick="addMeter()">+ Add Meter</button>
        <button class="btn-primary" onclick="calculateAll()">Calculate Usage</button>
      </div>

      <div class="summary">
        <div class="summary-card">
          <div>Total Meters</div>
          <div class="big" id="totalMeters">1</div>
        </div>
        <div class="summary-card">
          <div>Total Usage (m³)</div>
          <div class="big" id="totalUsage">0</div>
        </div>
        <div class="summary-card">
          <div>Property Status</div>
          <div class="big" id="propertyStatus">🟢</div>
        </div>
      </div>

      <div class="upgrade-note" id="upgradeNote"></div>
    </div>
  </div>

  <script>
    let meterCount = 0;
    const maxBasicMeters = 3;

    function meterTemplate(index) {
      return `
        <div class="meter-card" id="meterCard${index}">
          <div class="meter-title">
            <span>Meter ${index}</span>
            <span id="meterBadge${index}">🟢</span>
          </div>

          <div class="grid-4">
            <div>
              <label class="label">Meter Number</label>
              <input type="text" id="meterNo${index}" placeholder="Meter number" />
            </div>

            <div>
              <label class="label">Last Month Meter</label>
              <input type="number" id="lastMeter${index}" placeholder="Last month" />
            </div>

            <div>
              <label class="label">Today's Meter</label>
              <input type="number" id="todayMeter${index}" placeholder="Today" />
            </div>

            <div>
              <label class="label">Usage (m³)</label>
              <div class="usage-box">
                <span id="usage${index}">0</span>
                <span>m³</span>
              </div>
            </div>
          </div>

          <div class="status" id="statusText${index}">
            <span class="dot green" id="statusDot${index}"></span>
            <span>Normal usage</span>
          </div>
        </div>
      `;
    }

    function addMeter() {
      if (meterCount >= maxBasicMeters) {
        document.getElementById("upgradeNote").innerHTML =
          `<span class="warn">Basic supports up to 3 meters only.</span> Upgrade for meter 4 and up.`;
        return;
      }

      meterCount++;
      document.getElementById("metersContainer").insertAdjacentHTML("beforeend", meterTemplate(meterCount));
      document.getElementById("totalMeters").textContent = meterCount;
      document.getElementById("upgradeNote").textContent = "";
    }

    function getStatusFromUsage(usage) {
      if (usage <= 10) {
        return { emoji: "🟢", cls: "green", text: "Normal usage" };
      } else if (usage <= 25) {
        return { emoji: "🟠", cls: "orange", text: "A bit unusual" };
      } else {
        return { emoji: "🔴", cls: "red", text: "Suspicious activity" };
      }
    }

    function calculateAll() {
      let totalUsage = 0;
      let propertyLevel = "green";

      for (let i = 1; i <= meterCount; i++) {
        const last = parseFloat(document.getElementById(`lastMeter${i}`).value) || 0;
        const today = parseFloat(document.getElementById(`todayMeter${i}`).value) || 0;

        let usage = today - last;
        if (usage < 0) usage = 0;

        document.getElementById(`usage${i}`).textContent = usage.toFixed(1).replace(".0", "");
        totalUsage += usage;

        const status = getStatusFromUsage(usage);
        document.getElementById(`meterBadge${i}`).textContent = status.emoji;

        const dot = document.getElementById(`statusDot${i}`);
        dot.className = `dot ${status.cls}`;

        document.getElementById(`statusText${i}`).innerHTML =
          `<span class="dot ${status.cls}" id="statusDot${i}"></span><span>${status.text}</span>`;

        if (status.cls === "red") {
          propertyLevel = "red";
        } else if (status.cls === "orange" && propertyLevel !== "red") {
          propertyLevel = "orange";
        }
      }

      document.getElementById("totalUsage").textContent = totalUsage.toFixed(1).replace(".0", "");

      if (propertyLevel === "red") {
        document.getElementById("propertyStatus").textContent = "🔴";
      } else if (propertyLevel === "orange") {
        document.getElementById("propertyStatus").textContent = "🟠";
      } else {
        document.getElementById("propertyStatus").textContent = "🟢";
      }
    }

    // start with 1 meter visible
    addMeter();
  </script>
</body>
</html>
